<!-- The Open Graph protocol -->
<!-- https://ogp.me/ -->

{{ $iso8601 := "2006-01-02T15:04:05-07:00" -}}

<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary | plainify }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}{{ end }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ .Site.Title }}">

{{- $ogImage := .Params.hero_image | default "/images/Lightup-Data-Quality-and-Data-Observability-platform-UI-2048x1068.webp" }}
<meta property="og:image" content="{{ $.Site.BaseURL | strings.TrimRight "/" }}{{ $ogImage }}">

{{- if .IsPage }}
  <meta property="article:section" content="{{ .Section }}">
  {{ with .PublishDate }}
    <meta property="article:published_time" {{ .Format $iso8601 | printf "content=%q" | safeHTMLAttr }}>
  {{ end }}
  {{ with .Lastmod }}
    <meta property="article:modified_time" {{ .Format $iso8601 | printf "content=%q" | safeHTMLAttr }}>
  {{ end }}
{{- end -}}
