<!-- Twitter / X Cards -->
<!-- https://developer.x.com/en/docs/x-for-websites/cards/overview/summary-card-with-large-image -->

{{- $twitterImage := .Params.hero_image | default "/images/Lightup-Data-Quality-and-Data-Observability-platform-UI-2048x1068.webp" }}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ $.Site.BaseURL | strings.TrimRight "/" }}{{ $twitterImage }}">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary | plainify }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}{{ end }}">
{{ with .Site.Params.Social.twitter -}}
<meta name="twitter:site" content="@{{ . }}">
{{ end -}}
